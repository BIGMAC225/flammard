[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**"]

# pdf-parse loads @napi-rs/canvas (a native module) for PDF reports; esbuild
# can't bundle .node binaries, so ship the package as-is with the function.
[functions."taxdome-import-background"]
  external_node_modules = ["@napi-rs/canvas"]
